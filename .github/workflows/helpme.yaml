name: DevSecOps Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Run TruffleHog
              uses: trufflesecurity/trufflehog@main
              continue-on-error: true
              with:
                path: ./
                base: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
                head: ${{ github.event.pull_request.head.sha || github.sha }}
                extra_args: --results=verified

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              continue-on-error: true
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
                GITLEAKS_ENABLE_SUMMARY: 'true'

            - name: Upload Gitleaks SARIF to Security tab
              if: ${{ always() && hashFiles('results.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: results.sarif
                category: gitleaks

    sast-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Discover SonarCloud project configuration
              id: sonar-config
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                python3 - <<'PYSONAR'
                import json, os, urllib.request, urllib.parse
                def get(path, params):
                    url = 'https://sonarcloud.io/api/' + path + '?' + urllib.parse.urlencode(params)
                    req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['SONAR_TOKEN']})
                    with urllib.request.urlopen(req, timeout=30) as response:
                        return json.load(response)
                organizations = get('organizations/search', {'member': 'true', 'ps': 100}).get('organizations', [])
                matches = []
                for org in organizations:
                    projects = get('components/search', {'organization': org['key'], 'qualifiers': 'TRK', 'q': 'DontEverPushThisCodeV2', 'ps': 100})
                    for project in projects.get('components', []):
                        if 'donteverpushthiscodev2' in (project['key'] + ' ' + project['name']).lower():
                            matches.append((org['key'], project['key']))
                if len(matches) != 1:
                    raise SystemExit('Expected one imported workshop project; matched ' + str(len(matches)))
                org, key = matches[0]
                with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                    output.write('organization=' + org + '\nproject_key=' + key + '\n')
                print('Workshop Sonar organization: ' + org)
                print('Workshop Sonar project key: ' + key)
                PYSONAR

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v7.1.0
              continue-on-error: true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              with:
                args: >
                  -Dsonar.host.url=https://sonarcloud.io
                  -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || steps.sonar-config.outputs.organization }}
                  -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || steps.sonar-config.outputs.project_key }}

    codeql-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }}
        strategy:
            matrix:
                language: [ 'javascript-typescript' ]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                languages: ${{ matrix.language }}
                queries: security-extended,security-and-quality

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                category: "/language:${{ matrix.language }}"

    dependency-scanning:
        runs-on: ubuntu-latest
        needs: [sast-scan, secret-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node 20
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Depcheck
              uses: dependency-check/Dependency-Check_Action@main
              continue-on-error: true
              id: Depcheck
              with:
                project: 'DontEverPushThisCodeV2'
                path: '.'
                format: 'SARIF'
                out: 'reports'
                args: >
                    --failOnCVSS 7
                    --enableRetired

            - name: Upload Depcheck SARIF to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                  sarif_file: reports/dependency-check-report.sarif
                  category: dependency-check

            - name: Upload Depcheck HTML report as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: depcheck-report
                path: reports/

    image-scanning:
        runs-on: ubuntu-latest
        needs: [dependency-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t my-app:latest .

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@master
              continue-on-error: true
              with:
                image-ref: 'my-app:latest'
                format: 'sarif'
                output: 'trivy-results.sarif'
                limit-severities-for-sarif: true
                ignore-unfixed: false
                severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

            - name: Upload Trivy SARIF to Security tab
              if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: trivy-results.sarif
                category: trivy

            - name: Upload Trivy report artifact
              if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
              uses: actions/upload-artifact@v4
              with:
                name: trivy-report
                path: trivy-results.sarif
